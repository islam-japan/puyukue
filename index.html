<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ぷゆゆクエスト ～終わらない大冒険～</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#18231f;color:#f7f3e9;font-family:system-ui,sans-serif}
main{max-width:650px;margin:auto}h1{font-size:22px;margin:4px 0}button{border:2px solid #887c62;border-radius:12px;padding:12px;background:#f4ead4;color:#29251e;font-weight:800;font-size:15px;touch-action:manipulation}
button:active{transform:scale(.96);background:#e6d2a8}.panel{background:#293b34;border:1px solid #637365;border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:#d1d6c9}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:9px;background:#59665c;border-radius:9px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:#55c879}
canvas{width:100%;display:block;image-rendering:pixelated;border-radius:8px;background:#70ae65}
.controls{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center}.move{font-size:23px;width:58px;height:54px;padding:0}
.actions{display:grid;gap:8px;grid-template-columns:1fr 1fr}.primary{background:#d4a94e}.hidden{display:none!important}
#message{min-height:42px;font-size:14px}#popup,#battle{background:#354b40}
</style>
</head>
<body><main>
<header class="row"><div><h1>🥺 ぷゆゆクエスト</h1><div class="small">終わらない大冒険 ～第1章～</div></div><b id="place">はじまりの街</b></header>
<section class="panel stats">
 <div><b>🥺 勇者ぷゆゆ</b> <span id="lv">Lv.1</span><div>HP <span id="hp">30/30</span></div><div class="bar"><span id="hpbar" style="width:100%"></span></div></div>
 <div><b>🤥 戦士ゆめちゃん</b><div>🪙 <span id="gold">20</span> G</div><div>⚔️ 攻撃力 <span id="atk">5</span></div></div>
</section>
<section class="panel"><canvas id="map" width="480" height="336" aria-label="冒険マップ"></canvas><div class="row small"><span id="area">📍 はじまりの街</span><span id="coords">12,12</span></div></section>
<section class="panel"><b>📢 現在の状況</b><div id="message">冒険開始！近くにいる長老に話しかけてみよう。</div><div class="small" id="near">近くにいる人：街の長老 👴</div></section>
<section class="panel">
 <b>🕹️ 移動コントローラー</b>
 <div class="row" style="align-items:center;margin-top:10px">
  <div class="controls"><span></span><button class="move" data-m="0,-1">⬆️</button><span></span><button class="move" data-m="-1,0">⬅️</button><button class="move" data-m="0,1">⬇️</button><button class="move" data-m="1,0">➡️</button></div>
  <div class="actions" style="flex:1"><button class="primary" id="talk">💬 話す・調べる</button><button id="bag">🎒 メニュー</button><button id="mapinfo" style="grid-column:span 2">🗺️ 地図の案内</button></div>
 </div><div class="small" style="margin-top:8px">矢印で1マス移動。人の近くで会話ボタンを押そう。</div>
</section>
<section id="popup" class="panel hidden"><b id="ptitle">会話</b><p id="ptext"></p><div id="pbuttons" class="actions"></div></section>
<section id="battle" class="panel hidden">
 <b style="display:block;text-align:center">⚔️ モンスター出現！</b>
 <div class="row" style="justify-content:space-around;text-align:center;padding:12px"><div><div id="monster" style="font-size:38px">🟢</div><b id="mname">スライム</b><div id="mhp" class="small">HP 12/12</div></div><b>VS</b><div style="font-size:34px">🥺🤥</div></div>
 <div class="bar"><span id="mbar" style="width:100%;background:#df795e"></span></div><p id="fightmsg" class="small">行動を選んでね！</p>
 <div class="actions"><button class="primary" id="hit">⚔️ 攻撃</button><button id="special">✨ 強攻撃</button><button id="heal">🧪 回復薬</button><button id="escape">🏃 逃げる</button></div>
</section>
<section id="inventory" class="panel hidden"><b>🎒 冒険者メニュー</b><p id="items"></p><button id="close">閉じる</button></section>
<section class="panel"><b>📜 メインクエスト</b><div id="mission">街の長老に話しかけよう</div><div class="small">🧪 回復薬：<span id="pots">2</span>個　|　🌟 EXP：<span id="xp">0</span></div></section>
<button id="reset">↻ 最初からやり直す</button>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d');
const W=48,H=38;let grid=[],p={x:12,y:12},hp=30,max=30,lv=1,atk=5,xp=0,gold=20,pots=2,steps=0,sword=false,quest=0,fight=null,modal=false;
const people=[{x:10,y:10,e:'👴',n:'街の長老',t:'勇者ぷゆゆよ！北の森に魔物が現れた。森の祠を調べてくれないか？',kind:'elder'},{x:15,y:12,e:'🧙',n:'道具屋',t:'回復薬は10Gだよ！冒険のお供にどうぞ。',kind:'shop'},{x:13,y:16,e:'🧑',n:'旅人',t:'北東の森には古代の祠があるらしいよ。',kind:'traveler'},{x:8,y:13,e:'👧',n:'少女',t:'ぷゆゆ様、応援してるよ！',kind:'girl'}];
function makeMap(){
grid=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?'water':'grass'));
for(let y=2;y<14;y++)for(let x=22;x<38;x++)if((x*7+y*11)%5!==0)grid[y][x]='forest';
for(let y=2;y<10;y++)for(let x=39;x<47;x++)grid[y][x]='mountain';
for(let y=23;y<30;y++)for(let x=28;x<36;x++)grid[y][x]='water';
for(let y=8;y<19;y++)for(let x=6;x<20;x++)grid[y][x]='town';
for(let y=10;y<17;y++)for(let x=9;x<17;x++)grid[y][x]='road';
for(let x=13;x<45;x++)grid[13][x]='road';
for(let y=13;y<35;y++)grid[y][30]='road';
for(let x=30;x<43;x++)grid[27][x]='road';
grid[7][37]='shrine';
for(let y=19;y<25;y++)for(let x=40;x<46;x++)grid[y][x]='cave';
}
function drawTile(x,y,ox,oy){
let v=grid[y][x],a=(x-ox)*24,b=(y-oy)*24;
ctx.fillStyle=({grass:'#70ae65',forest:'#326a43',water:'#468eae',town:'#c6a477',road:'#dfc28a',mountain:'#89918a',shrine:'#c7a24a',cave:'#52465a'})[v]||'#70ae65';ctx.fillRect(a,b,24,24);
if(v==='forest'){ctx.fillStyle='#18482f';ctx.fillRect(a+3,b+9,18,13);ctx.fillStyle='#39834b';ctx.fillRect(a+6,b+3,13,15);ctx.fillStyle='#78533b';ctx.fillRect(a+10,b+17,5,7)}
if(v==='water'){ctx.fillStyle='#a4d5dc';ctx.fillRect(a+3,b+8,10,2);ctx.fillRect(a+15,b+16,6,2)}
if(v==='town'){ctx.fillStyle='#a05b45';ctx.fillRect(a+3,b+4,18,9);ctx.fillStyle='#f0d5a4';ctx.fillRect(a+5,b+12,14,11);ctx.fillStyle='#80523b';ctx.fillRect(a+11,b+16,5,7)}
if(v==='mountain'){ctx.fillStyle='#d5d2c5';ctx.fillRect(a+6,b+4,12,8);ctx.fillStyle='#59675d';ctx.fillRect(a+3,b+14,18,9)}
if(v==='shrine'){ctx.fillStyle='#f3dda1';ctx.fillRect(a+4,b+5,16,17);ctx.fillStyle='#76513b';ctx.fillRect(a+10,b+13,5,9)}
if(v==='cave'){ctx.fillStyle='#25232d';ctx.fillRect(a+3,b+8,18,16)}
}
function render(){
let ox=Math.max(0,Math.min(W-20,p.x-10)),oy=Math.max(0,Math.min(H-14,p.y-7));
for(let y=0;y<14;y++)for(let x=0;x<20;x++)drawTile(x+ox,y+oy,ox,oy);
function spr(e,x,y){ctx.font='21px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,(x-ox)*24+12,(y-oy)*24+13)}
people.forEach(n=>spr(n.e,n.x,n.y));spr('🥺',p.x,p.y);spr('🤥',p.x,p.y+.35);
let v=grid[p.y][p.x],area=p.x>=6&&p.x<20&&p.y>=8&&p.y<19?'はじまりの街':v==='forest'?'ひみつの森':v==='shrine'?'古代の祠':v==='mountain'?'北の山脈':v==='cave'?'暗黒の洞窟':p.x>25?'東の草原':'冒険の平原';
$('place').textContent=area;$('area').textContent='📍 '+area;$('coords').textContent=p.x+','+p.y;
let near=people.find(n=>Math.abs(n.x-p.x)+Math.abs(n.y-p.y)<=1);
$('near').textContent=near?'近くにいる人：'+near.n+' '+near.e:'近くに話せる人はいないよ';
$('talk').textContent=near?'💬 '+near.n+' と話す':'🔍 周囲を調べる';
}
function say(s){$('message').textContent=s}
function stats(){$('lv').textContent='Lv.'+lv;$('hp').textContent=hp+'/'+max;$('hpbar').style.width=hp/max*100+'%';$('gold').textContent=gold;$('atk').textContent=atk;$('xp').textContent=xp;$('pots').textContent=pots}
function blocked(x,y){return !grid[y]||!grid[y][x]||['water','mountain','town','cave'].includes(grid[y][x])||people.some(n=>n.x===x&&n.y===y)}
function move(dx,dy){
if(fight||modal||!$('inventory').classList.contains('hidden'))return;
let x=p.x+dx,y=p.y+dy;if(blocked(x,y)){let n=people.find(n=>n.x===x&&n.y===y);if(n)talk(n);else say('ここは通れないみたい！');return}
p={x,y};steps++;render();
if(grid[y][x]==='shrine'&&!sword){talk({n:'古代の祠',e:'⛩️',t:'祠の奥に勇者の剣が眠っている！',kind:'shrine'});return}
if(steps%5===0&&['grass','forest'].includes(grid[y][x])&&Math.random()<.24)startFight();
}
function open(title,txt,buttons){modal=true;$('popup').classList.remove('hidden');$('ptitle').textContent=title;$('ptext').textContent=txt;let b=$('pbuttons');b.innerHTML='';buttons.forEach(([label,fn])=>{let x=document.createElement('button');x.textContent=label;x.onclick=fn;b.appendChild(x)})}
function close(){modal=false;$('popup').classList.add('hidden')}
function talk(n){
if(fight)return;let opts=[];
if(n.kind==='elder')opts.push(['依頼を受ける！⚔️',()=>{close();quest=1;$('mission').textContent='北東の森にある祠を探そう！';say('長老の依頼を受けた！北東の森へ向かおう！')}]);
else if(n.kind==='shop')opts.push(['回復薬を買う 10G',()=>{if(gold>=10){gold-=10;pots++;say('回復薬を買った！')}else say('お金が足りないよ！');stats();close()}]);
else if(n.kind==='shrine')opts.push(['剣を手に入れる！',()=>{sword=true;atk+=5;quest=2;$('mission').textContent='長老に剣のことを報告しよう';close();stats();say('勇者の剣を手に入れた！攻撃力が上がった！')}]);
else opts.push(['ありがとう！',()=>{close();say(n.n+'と話した！')}]);
opts.push(['閉じる',close]);open(n.e+' '+n.n,n.t,opts);
}
function interact(){if(fight)return;let n=people.find(n=>Math.abs(n.x-p.x)+Math.abs(n.y-p.y)<=1);if(n){talk(n);return}if(grid[p.y][p.x]==='shrine'&&!sword){talk({n:'古代の祠',e:'⛩️',t:'勇者の剣が眠っている！',kind:'shrine'});return}say('周囲には何もないようだ。矢印で探索しよう！')}
function startFight(){let list=[['スライム','🟢',12,3,8,5],['森のゴブリン','👺',19,5,13,9],['野生のオオカミ','🐺',25,6,17,12],['洞窟の魔物','👾',35,8,25,20]],z=list[Math.floor(Math.random()*(grid[p.y][p.x]==='forest'?4:3))];fight={n:z[0],e:z[1],hp:z[2],max:z[2],atk:z[3],xp:z[4],gold:z[5]};$('battle').classList.remove('hidden');fightStats();say(z[0]+'が現れた！')}
function fightStats(){$('monster').textContent=fight.e;$('mname').textContent=fight.n;$('mhp').textContent='HP '+fight.hp+'/'+fight.max;$('mbar').style.width=100*fight.hp/fight.max+'%'}
function endFight(s){fight=null;$('battle').classList.add('hidden');say(s);stats()}
function enemyTurn(){if(!fight)return;let d=Math.max(1,fight.atk-Math.floor(lv/2));hp=Math.max(0,hp-d);$('fightmsg').textContent='敵の攻撃！ '+d+' ダメージ！';stats();if(hp===0){hp=Math.ceil(max/2);p={x:12,y:12};gold=Math.max(0,gold-5);endFight('街に戻された……HPは半分まで回復したよ。');render()}}
function win(){let e=fight;gold+=e.gold;xp+=e.xp;endFight(e.n+'を倒した！ '+e.xp+' EXP / '+e.gold+' G獲得！');if(xp>=lv*20){xp-=lv*20;lv++;max+=8;hp=max;atk+=2;say('🎉 レベルアップ！ Lv.'+lv+' になった！')}stats()}
function action(type){if(!fight)return;if(type==='run'){endFight('無事に逃げ切った！');return}if(type==='heal'){if(!pots){$('fightmsg').textContent='回復薬がない！';return}if(hp===max){$('fightmsg').textContent='HPは満タンだよ！';return}pots--;hp=Math.min(max,hp+18);$('fightmsg').textContent='回復薬でHPが回復！';stats();enemyTurn();return}let d=type==='special'?atk*2+4:atk+Math.floor(Math.random()*4);fight.hp=Math.max(0,fight.hp-d);fightStats();$('fightmsg').textContent='攻撃！ '+d+' ダメージ！';if(!fight.hp){win();return}enemyTurn()}
$('hit').onclick=()=>action('hit');$('special').onclick=()=>action('special');$('heal').onclick=()=>action('heal');$('escape').onclick=()=>action('run');
document.querySelectorAll('#pq2 [data-m]').forEach(b=>b.addEventListener('click',()=>move(...b.dataset.m.split(',').map(Number))));
$('talk').onclick=interact;$('bag').onclick=()=>{if(fight)return;$('inventory').classList.remove('hidden');$('items').innerHTML='🥺 勇者ぷゆゆ Lv.'+lv+'<br>❤️ HP '+hp+'/'+max+'<br>⚔️ 攻撃 '+atk+'<br>🧪 回復薬 '+pots+'個<br>🪙 '+gold+'G<br>🗡️ '+(sword?'勇者の剣':'勇者の剣は未入手')+'<br>🤥 ゆめちゃん同行中'};
$('close').onclick=()=>$('inventory').classList.add('hidden');$('mapinfo').onclick=()=>say('街は南西、森と祠は北東！矢印で自由に歩き回ろう。');
$('reset').onclick=()=>{if(!confirm('最初からやり直しますか？'))return;p={x:12,y:12};hp=max=30;lv=1;atk=5;xp=0;gold=20;pots=2;steps=0;sword=false;quest=0;fight=null;modal=false;makeMap();$('mission').textContent='街の長老に話しかけよう';$('popup').classList.add('hidden');$('battle').classList.add('hidden');$('inventory').classList.add('hidden');stats();render();say('新しい冒険が始まった！')};
document.addEventListener('keydown',e=>{if(!document.body.contains(root))return;let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}if(e.key===' '||e.key==='Enter'){e.preventDefault();interact()}});
makeMap();stats();render();
})();
</script></body></html>
